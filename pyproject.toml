[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "pete-mcp-core"
version = "0.1.0"
description = "Shared substrate for pete-builds MCP servers: structured logging, healthcheck, transport wiring, tool-error decorator, settings base, and bearer-token auth builder over FastMCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pete Stergion", email = "pstergion@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "fastmcp", "framework", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
]

[project.scripts]
pete-mcp-healthcheck = "pete_mcp_core.healthcheck:main"

[project.urls]
Homepage = "https://github.com/pete-builds/pete-mcp-core"
Repository = "https://github.com/pete-builds/pete-mcp-core"
Issues = "https://github.com/pete-builds/pete-mcp-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pete_mcp_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pete_mcp_core",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["pete_mcp_core"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "S",
    "RUF",
]
ignore = [
    "S101",
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src/pete_mcp_core"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true
